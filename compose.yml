services:
  mc:
    image: itzg/minecraft-server:stable
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "26.2"
      MEMORY: "1024M"
      MOTD: "Meowtown is back on the menu."
      ONLINE_MODE: "false"
      USE_MEOWICE_FLAGS: "true"
      DIFFICULTY: "3"
      SPAWN_PROTECTION: "0"
      ENABLE_WHITELIST: "true"
      MODRINTH_PROJECTS: |-
        chunky:MdY6JATr
        coreprotect:3sehX6Sg
        discordsrv:ATlquwiT
        essentialsx:nY6VN1XH
        gsit:gnY5Flgo
        authmereloaded:fPuH4uYs
        pl3xmap:aFdUoUCd
        skinsrestorer:ziIzW16f
        viaversion:5WgnasGG
        worldedit:YFnqiUlL
        worldguard:TtfwTyi6
        luckperms:b0mk8uS6
        terralith:CzijfXJQ
      SPIGET_RESOURCES: |-
        34315
      VANILLATWEAKS_SHARECODE: "RZv44H"
    volumes:
      - "./data:/data"
      - './plugins:/plugins'
      - "./extras:/extras"
